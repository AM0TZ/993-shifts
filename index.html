<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סידור עבודה 993</title>
<script>window.C993_VIEWER=true</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12215c">
<script>/* set the bar color before the page draws (the page updates it on theme changes) */
try{var m=localStorage.getItem("c993_theme")||"auto",d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
document.querySelector('meta[name=theme-color]').content=m==="brand"?"#12215c":d?"#0c0e0d":"#f3f4f1";}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f4f1;--card:#fff;--ink:#17201a;--muted:#66706a;--line:#dde2db;--accent:#2b7a4b;--accent-ink:#fff;--soft:#e1efe6;--head:#1f4d33;--today:#eef6f0;--warn:#b4441f;--shadow:0 1px 2px rgba(0,0,0,.05)}
  :root[data-theme=brand]{--bg:#12215c;--card:#232f78;--ink:#ffffff;--muted:#c3c8ea;--line:#3d4a9a;--accent:#fff100;--accent-ink:#0b3b8c;--soft:#2c3a8c;--head:#fff100;--head-ink:#0b3b8c;--today:#1b2d7a;--warn:#ff5a62;--shadow:none;color-scheme:dark}
  :root[data-theme=dark]{--bg:#0c0e0d;--card:#161917;--ink:#f1f2ee;--muted:#98a29b;--line:#2a2f2c;--accent:#4fae75;--accent-ink:#06150c;--soft:#1c3427;--head:#1f4d33;--today:#14241a;--warn:#e9774f;--shadow:none;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px 24px}
  .tab{display:none}.tab.on{display:block}
  header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
  .title{display:flex;align-items:center;gap:8px}
  .title h1{flex:1;margin:0;font-size:19px;font-weight:800;line-height:1.2}
  .title h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .icon{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:40px;height:40px;padding:0 10px;display:grid;place-items:center;font-size:16px}
  .icon:active{background:var(--soft)}
  .pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
  .pill.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
  .sec{font-size:14px;font-weight:700;color:var(--muted);margin:16px 2px 8px}

  /* ---- "ממותג": Tzomet Sfarim look (yellow band, blue, red book, green pages) ---- */
  :root[data-theme=brand] header.top h1{color:#fff}
  :root[data-theme=brand] header.top h1 small{color:#fff100}
  :root[data-theme=brand] header.top{box-shadow:0 3px 0 -1px #fff100}
  :root[data-theme=brand] .grid{border-color:#fff100}
  :root[data-theme=brand] .grid tr.today th{box-shadow:inset -4px 0 0 #d2202a}
  :root[data-theme=brand] .big.alt{border-color:#d2202a}
  :root[data-theme=brand] nav{border-top:3px solid #fff100}
  :root[data-theme=brand] .sheet{border-top:4px solid #fff100}
  :root[data-theme=brand] .lock .ic{background:#fff100;color:#0b3b8c}
  :root[data-theme=brand] .weeknav .lbl span{color:#72ba43}
  .themeBtn img.bk{width:24px;height:24px;border-radius:6px;display:block}

  /* ---- shifts grid ---- */
  .weeknav{display:flex;align-items:center;gap:8px;margin-top:10px}
  .weeknav .lbl{flex:1;text-align:center;font-weight:700;font-size:16px}
  .weeknav .lbl span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  table.grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .grid th,.grid td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:middle}
  .grid tr>*:last-child{border-left:0}
  .grid tbody tr:last-child>*{border-bottom:0}
  .grid thead th{background:var(--head);color:var(--head-ink,#fff);font-size:13px;font-weight:700;line-height:1.15;padding:8px 2px}
  .grid thead th small{display:block;font-weight:400;font-size:10.5px;opacity:.85;direction:ltr}
  .grid tbody th{font-size:13px;font-weight:700;width:64px;line-height:1.15}
  .grid tbody th small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .grid col.off{width:15%}
  .grid td{height:56px;cursor:pointer;font-size:14px;line-height:1.25}
  .grid td:active{background:var(--soft)}
  .grid tr.today>*{background:var(--today)}
  .grid tr.today th{box-shadow:inset -3px 0 0 var(--accent)}
  .name{display:inline-block;padding:2px 7px;border-radius:7px;margin:1px 0;font-weight:500;background:var(--c);color:var(--ct)}
  .name.me{font-weight:800;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
  .sw{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;padding:0}
  .pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 2px 4px}
  .pal button{aspect-ratio:1;border-radius:9px;border:3px solid transparent}
  .pal button.on{border-color:var(--ink)}
  .staff button .dot{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);margin-inline-end:6px;vertical-align:-1px}
  .staff button.on{background:var(--c);border-color:var(--c);color:var(--ct)}
  .staff button.on .dot{background:var(--ct);opacity:.6}
  .grid td.empty::after{content:"+";color:var(--line);font-size:18px}
  .mine{display:flex;flex-direction:column;gap:6px}
  .mine .it{display:flex;justify-content:space-between;gap:8px;font-size:15px}
  .mine .it b{font-weight:700}
  .mine .tot{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;font-weight:700}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* ---- clock ---- */
  .quick{display:flex;gap:10px}
  .big{flex:1;border:0;border-radius:14px;padding:14px 8px;font-size:17px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
  .big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .big small{display:block;font-size:12px;font-weight:500;opacity:.8}
  table.log{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;table-layout:fixed}
  .log th{font-size:13px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
  .log td{padding:11px 6px;border-bottom:1px solid var(--line);font-size:16px;font-variant-numeric:tabular-nums}
  .log tr:last-child td{border-bottom:0}
  .log tbody tr{cursor:pointer}.log tbody tr:active{background:var(--soft)}
  .log td.note{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log td.t{direction:ltr;text-align:right}
  .month{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
  .month b{font-size:15px}
  .emptybox{text-align:center;color:var(--muted);padding:28px 10px}

  /* ---- publishers ---- */
  input,select{width:100%;font:inherit;font-size:17px;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px;margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .res{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}
  .logo{width:56px;height:56px;flex-shrink:0;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
  .logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .logo.ph{background:var(--soft);color:var(--accent);font-weight:800;font-size:24px;border-color:transparent}
  .pub{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.25}
  .pub mark{background:var(--soft);color:inherit;border-radius:4px;padding:0 2px}
  .note2{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .sup{text-align:left;flex-shrink:0}
  .sup b{display:block;color:var(--accent);font-size:16px}
  .sup span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  #tab-pubs.on{position:fixed;top:0;left:0;right:0;bottom:64px;display:block}
  #pubsFrame{width:100%;height:100%;border:0;display:block;background:var(--bg)}

  /* ---- bottom nav ---- */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:8px 0 10px;color:var(--muted);font-size:12px;font-weight:500}
  nav button i{display:block;height:26px}
  nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--accent);font-weight:800}

  /* ---- sheet ---- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .18s ease}
  .sheet.on{transform:none}
  .sheet h2{margin:0 0 4px;font-size:18px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
  .sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  .sheet .acts{display:flex;gap:8px;margin-top:16px}
  .sheet .acts button{flex:1;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--card)}
  .sheet .acts .pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .sheet .acts .del{color:var(--warn)}
  .two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
  .staff{display:flex;flex-wrap:wrap;gap:8px}
  .staff button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:700}
  .hint{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
  .typerow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-bottom:6px}
  .typerow input{padding:8px 8px;font-size:15px}
  .lst{display:flex;flex-direction:column;gap:6px}
  .lst .r{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
  .lst .r span{flex:1}
  .lst .r button{border:0;background:none;color:var(--warn);font-size:14px}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
  .sheet.on ~ .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
  .sync{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
  .sync.err{color:var(--warn)}
  .sync button{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700;padding:0 4px}
  body.viewer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  body.viewer nav,body.viewer #btnCopy,body.viewer #btnClearWeek,body.viewer .mgr{display:none}
  body.viewer .grid td{cursor:default}
  body.viewer .grid td.empty::after{content:""}
  body.viewer .grid td:active{background:inherit}
  .sec.me-row{display:flex;align-items:center;gap:8px}
  .sec.me-row span.t{flex:1}
  .sec.me-row .pill{font-size:13px;padding:5px 12px;color:var(--accent);font-weight:700}
  .lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
  .lock.on{display:flex}
  .lock .box{width:100%;max-width:360px;text-align:center}
  .lock .ic{width:64px;height:64px;border-radius:18px;background:var(--head);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
  .lock h2{margin:0 0 4px;font-size:22px}
  .lock p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .lock input{text-align:center;font-size:20px}
  .lock .err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}
  .lock button.go{width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
  .pubbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:6px}
  .pubbox a{color:var(--accent);word-break:break-all}
</style>
</head>
<body>

<!-- ========== SHIFTS ========== -->
<section class="tab wrap" id="tab-shifts">
  <header class="top">
    <div class="title">
      <h1>סידור עבודה 993<small>רויאל גארדן אילת</small></h1>
      <button class="icon themeBtn" title="בהיר / כהה"></button>
      <button class="icon" id="btnShare" title="שיתוף הסידור כתמונה">⤴</button>
      <button class="icon" id="btnSettings" title="הגדרות">⚙</button>

    <div class="weeknav">
      <button class="icon" id="wPrev" title="שבוע קודם">▶</button>

    <button class="pill" id="btnToday">לשבוע הנוכחי</button>

<!-- ========== PUBLISHERS (the Publishers app's own page, embedded) ========== -->
<section class="tab" id="tab-pubs"><iframe id="pubsFrame" title="איתור ספק לפי הוצאה"></iframe></section>

<nav id="nav">
  <button data-tab="shifts"><i><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2M8 17.5h2"/></svg></i>משמרות</button>

  <button data-tab="pubs"><i><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg></i>הוצאות</button>
</nav>

  <div class="ic">🔒</div>
  <h2>סידור עבודה 993</h2>

  <input id="lockPw" type="password" placeholder="סיסמה" autocomplete="current-password">
  <div class="err" id="lockErr"></div>
  <button class="go" type="submit">כניסה</button>
</form></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<div id="fatal" style="display:none;position:fixed;inset:auto 12px 12px 12px;z-index:99;background:#b4441f;color:#fff;padding:12px 14px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;direction:rtl"></div>
<script>
// If anything breaks while loading, say so on screen instead of leaving an empty page.
window.addEventListener("error", function(e){
  var f=document.getElementById("fatal"); if(!f) return;
  f.style.display="block";
  f.textContent="הדף לא נטען כראוי: "+(e.message||"שגיאה")+(e.lineno?" (שורה "+e.lineno+")":"")+" · נסו לרענן. אם זה חוזר – שלחו צילום מסך למנהל.";
});
</script>
<script>
"use strict";
/* ================= storage & platform ================= */
const A = window.Android || null;
// Read-only web version for employees: the published site sets window.C993_VIEWER before this script.
const VIEWER = !A && !!window.C993_VIEWER;
// Where the manager app publishes the schedule, and where employees read it.
const SYNC = {repo:"AM0TZ/993-shifts", branch:"data", path:"shifts.json", site:"https://am0tz.github.io/993-shifts/"};
if(VIEWER) document.body.classList.add("viewer");
const MEM = {}; // used when the browser blocks site storage
const store = {
  get(k){ try{ const s = A ? A.load(k) : localStorage.getItem("c993_"+k); return s ? JSON.parse(s) : null; }catch(e){ return MEM[k]!==undefined ? MEM[k] : null; } },
  set(k,v){ MEM[k]=v; const s = JSON.stringify(v); try{ if(A) A.save(k,s); else localStorage.setItem("c993_"+k,s); }catch(e){} }
};
function share(text){ if(A) A.share(text); else if(navigator.share) navigator.share({text}); else { try{ navigator.clipboard.writeText(text); toast("הועתק"); }catch(e){} } }
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }

/* ================= theme ================= */
const THEME_NAMES={auto:"אוטומטי",light:"בהיר",dark:"כהה",brand:"ממותג"};
const THEME_ORDER=["auto","light","dark","brand"];
const THEME_BAR={light:"#f3f4f1",dark:"#0c0e0d",brand:"#12215c"};
function themeMode(){ try{ if(A) return A.getMode(); return localStorage.getItem("c993_theme")||"auto"; }catch(e){ return "auto"; } }
function sysDark(){ try{ if(A) return A.isSystemDark(); }catch(e){} return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches); }
const isDarkNow = () => { const m=themeMode(); return m==="dark"||m==="brand"||(m==="auto"&&sysDark()); };
// what is showing now: light / dark / brand

window.applyTheme=function(){
  const t=shownTheme(); document.documentElement.setAttribute("data-theme", t);
  // browser/system bar follows the page (Chrome); Firefox and installed apps use the manifest color (brand blue)
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content = THEME_BAR[t];
  // the header button shows the current view (sun = light, moon = dark, logo book = brand);
  // pressing it moves on: light → dark → brand → light
  const nxt={light:"dark",dark:"brand",brand:"light"}[t];
  document.querySelectorAll(".themeBtn").forEach(b=>{ b.innerHTML = t==="brand" ? BRAND_SW : t==="dark" ? "☾" : "☀"; b.title="מצב "+THEME_NAMES[t]+" · הקשה למעבר ל"+THEME_NAMES[nxt]; });
};
function toggleTheme(){
  const nxt={light:"dark",dark:"brand",brand:"light"}[shownTheme()];
  setTheme(nxt); if(window.syncFrameTheme) syncFrameTheme(); toast("מצב "+THEME_NAMES[nxt]);
}
document.addEventListener("click",e=>{ if(e.target.closest(".themeBtn")) toggleTheme(); });
function setTheme(m){ try{ if(A) A.setMode(m); else localStorage.setItem("c993_theme",m); }catch(e){} applyTheme(); }
applyTheme();

/* ================= dates ================= */
const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const sundayOf = d => addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()), -d.getDay());
const dm = d => d.getDate()+"/"+(d.getMonth()+1);
const todayIso = () => iso(new Date());
const nowHM = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const toMin = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const fmtH = mins => { const h=Math.floor(mins/60), m=mins%60; return m ? h+":"+pad(m) : String(h); };

const DEFAULT_TYPES=[
  {id:"m",  name:"בוקר", from:"10:00", to:"18:00"},
  {id:"mid",name:"אמצע", from:"12:00", to:"20:00"},
  {id:"e",  name:"ערב",  from:"16:00", to:"22:00"},
  {id:"off",name:"חופש"}
];
function seedShifts(){
  const E=[], w = {
    m:  [["אמוץ"],["לורין"],["לורין"],["לורין"],["אמוץ"],["לורין","אמוץ"],E],
    mid:[["לורין"],["אמוץ"],["אמוץ"],["דריה"],["לורין"],E,E],
    e:  [E,["דריה"],["דריה"],E,E,E,E],
    off:[E,E,E,E,E,E,E]
  };
  // JSON round-trip: every cell gets its own array
  return JSON.parse(JSON.stringify({staff:["אמוץ","לורין","דריה"], me:"אמוץ", types:DEFAULT_TYPES, weeks:{"2026-11-01":w}}));
}
function seedClock(){
  return [
    {id:1,date:"2026-09-07",in:"09:15",out:"",note:"בנק"},
    {id:2,date:"2026-09-11",in:"",out:"15:30",note:""},
    {id:3,date:"2026-09-16",in:"09:20",out:"",note:"בנק"},
    {id:4,date:"2026-09-23",in:"09:15",out:"",note:"בנק"},
    {id:5,date:"2026-09-28",in:"09:15",out:"",note:"בנק"}
  ];
}
let S;
// Fill in anything missing so an old or partial copy can never break the page.
function normalizeS(x){
  x = (x && typeof x==="object" && !x.enc && !x.pending) ? x : {};
  if(!Array.isArray(x.staff)) x.staff=[];
  if(!Array.isArray(x.types)||!x.types.length) x.types=DEFAULT_TYPES;
  if(!x.weeks||typeof x.weeks!=="object") x.weeks={};
  if(!x.colors||typeof x.colors!=="object") x.colors={};
  return x;
}
if(VIEWER){
  const cached=store.get("remote");
  if(cached && (cached.enc || !Array.isArray(cached.staff))) store.set("remote",null); // e.g. an encrypted copy saved by an older version
  S = normalizeS(cached);
  S.me = store.get("me") || "";
} else {
  S = store.get("shifts"); if(!S||!S.weeks){ S=seedShifts(); store.set("shifts",S); }
}
let C = store.get("clock");  if(!Array.isArray(C)){ C=seedClock(); store.set("clock",C); }
const saveS = () => { if(VIEWER) return; store.set("shifts",S); schedulePublish(); };
const saveC = () => store.set("clock",C);
const PALETTE=["#e0533d","#3b82f6","#a855f7","#f59e0b","#10b981","#ec4899","#06b6d4","#84cc16","#f97316","#6366f1","#78716c","#eab308"];
function textOn(hex){ const n=parseInt(hex.slice(1),16), l=.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255); return l>160?"#111":"#fff"; }
// Every employee keeps a color; new names get the first color nobody uses yet.
function ensureColors(){
  S.colors=S.colors||{}; let changed=false;
  for(const n of (S.staff||[])) if(!S.colors[n]){
    const used=new Set(Object.values(S.colors));
    S.colors[n]=PALETTE.find(c=>!used.has(c))||PALETTE[S.staff.indexOf(n)%PALETTE.length]; changed=true;
  }
  if(changed) saveS();
}
const colorOf = n => (S.colors&&S.colors[n]) || "#888888";
const cvars = n => `--c:${colorOf(n)};--ct:${textOn(colorOf(n))}`;
ensureColors();
const shiftTypes = () => S.types.filter(t=>t.id!=="off");
const ltr = s => "\u2066"+s+"\u2069";
const typeHours = t => t.from&&t.to ? ltr(`${t.from}–${t.to}`) : "";

function weekData(key, create){
  let w=S.weeks[key];
  if(!w && create){ w={}; S.weeks[key]=w; }
  if(w) for(const t of S.types) if(!Array.isArray(w[t.id])||w[t.id].length!==7) w[t.id]=Array.from({length:7},(_,i)=>(w[t.id]&&w[t.id][i])||[]);
  return w;
}
const cell = (key,tid,i) => { const w=weekData(key,false); return w&&w[tid]&&w[tid][i] ? w[tid][i] : []; };
function myShiftsOn(dateIso){
  const d=parse(dateIso), key=iso(sundayOf(d));
  return S.types.filter(t=>cell(key,t.id,d.getDay()).includes(S.me));
}

let week = iso(sundayOf(new Date()));
function weekLabel(key){
  const s=parse(key), e=addDays(s,6), cur=iso(sundayOf(new Date()));
  const diff=Math.round((s-parse(cur))/(7*864e5));
  const rel = diff===0?"השבוע":diff===1?"שבוע הבא":diff===-1?"שבוע שעבר":diff>0?`בעוד ${diff} שבועות`:`לפני ${-diff} שבועות`;
  return {range:`${dm(s)} – ${dm(e)}`, rel, diff};
}
function namesHtml(arr){ return arr.map(n=>`<span class="name${n===S.me?" me":""}" style="${cvars(n)}">${esc(n)}</span>`).join("<br>"); }
function renderShifts(){
  const L=weekLabel(week); $("wLabel").innerHTML=`${L.range}<span>${L.rel}</span>`;
  $("btnToday").style.display = L.diff===0 ? "none" : "";
  const start=parse(week), today=todayIso();
  let h=`<colgroup><col style="width:64px">${S.types.map(t=>`<col${t.id==="off"?' class="off"':""}>`).join("")}</colgroup>`;
  h+=`<thead><tr><th></th>${S.types.map(t=>`<th>${esc(t.name)}${t.from?`<small>${t.from}–${t.to}</small>`:""}</th>`).join("")}</tr></thead><tbody>`;
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    h+=`<tr class="${iso(d)===today?"today":""}"><th>${DAYS[i]}<small>${dm(d)}</small></th>`;
    for(const t of S.types){ const c=cell(week,t.id,i); h+=`<td data-t="${t.id}" data-i="${i}" class="${c.length?"":"empty"}">${namesHtml(c)}</td>`; }
    h+="</tr>";
  }
  $("grid").innerHTML=h+"</tbody>";
  // my week
  let rows="", total=0;
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    for(const t of S.types){ if(!cell(week,t.id,i).includes(S.me)) continue;
      const mins = t.from&&t.to ? toMin(t.to)-toMin(t.from) : 0; total+=mins;
      rows+=`<div class="it"><span><b>${DAYS[i]} ${dm(d)}</b> · ${esc(t.name)}</span><span class="muted" dir="ltr">${typeHours(t)}</span></div>`; }
  }
  const mineT = S.me ? `המשמרות של ${S.me} ב${L.rel==="השבוע"?"שבוע הזה":"שבוע "+L.range}` : "המשמרות שלי";
  if(VIEWER && S.me){
    $("mineTitle").className="sec me-row";
    $("mineTitle").innerHTML=`<span class="t">${esc(mineT)}</span><button class="pill" onclick="pickMe()">החלפת עובד</button>`;
  } else { $("mineTitle").className="sec"; $("mineTitle").textContent=mineT; }
  $("mine").innerHTML = rows ? rows+`<div class="it tot"><span>סה״כ</span><span>${fmtH(total)} שעות</span></div>` : (VIEWER&&!S.me ? `<div class="row"><span class="muted" style="flex:1">בחרו את השם שלכם כדי לראות כאן את המשמרות שלכם.</span><button class="pill acc" onclick="pickMe()">מי אני?</button></div>`
      : `<div class="muted">אין משמרות רשומות${S.me?" על שמך":""} בשבוע הזה.</div>`);
}
$("grid").onclick=e=>{ if(VIEWER) return; const td=e.target.closest("td[data-t]"); if(td) editCell(td.dataset.t, +td.dataset.i); };
function editCell(tid,i){
  const t=S.types.find(x=>x.id===tid), d=addDays(parse(week),i);
  const draw=()=>{
    const cur=cell(week,tid,i);
    openSheet(`<h2>${DAYS[i]} ${dm(d)} · ${esc(t.name)}</h2><div class="sub" dir="rtl">${typeHours(t)?"שעות "+typeHours(t)+" · ":""}בוחרים מי עובד/ת</div>
      <div class="staff">${S.staff.map(n=>`<button data-n="${esc(n)}" class="${cur.includes(n)?"on":""}" style="${cvars(n)}"><span class="dot"></span>${esc(n)}</button>`).join("")}</div>
      <label>שם נוסף</label><div class="two"><div><input id="newName" placeholder="שם עובד/ת"></div><div style="flex:0 0 auto"><button class="pill" id="addName" style="height:100%">הוספה</button></div></div>
      <div class="acts"><button class="del" data-a="clr">ניקוי</button><button class="pri" data-a="done">סיום</button></div>`, s=>{
        s.querySelectorAll(".staff button").forEach(b=>b.onclick=()=>{
          const w=weekData(week,true), arr=w[tid][i], n=b.dataset.n, k=arr.indexOf(n);
          if(k>=0) arr.splice(k,1); else arr.push(n);
          b.classList.toggle("on",k<0); saveS(); renderShifts();
        });
        s.querySelector("#addName").onclick=()=>{
          const n=s.querySelector("#newName").value.trim(); if(!n) return;
          if(!S.staff.includes(n)){ S.staff.push(n); ensureColors(); }
          const w=weekData(week,true); if(!w[tid][i].includes(n)) w[tid][i].push(n);
          saveS(); renderShifts(); draw();
        };
        s.querySelector("[data-a=clr]").onclick=()=>{ const w=weekData(week,false); if(w){ w[tid][i]=[]; saveS(); renderShifts(); } closeSheet(); };
        s.querySelector("[data-a=done]").onclick=closeSheet;
      });
  };
  draw();
}

$("btnCopy").onclick=()=>{
  const prevKey=iso(addDays(parse(week),-7)), prev=weekData(prevKey,false);
  if(!prev){ toast("אין סידור בשבוע הקודם"); return; }
  const go=()=>{ S.weeks[week]=JSON.parse(JSON.stringify(prev)); saveS(); renderShifts(); toast("הסידור הועתק"); };
  const cur=weekData(week,false);
  if(cur && S.types.some(t=>cur[t.id].some(c=>c.length))) confirmSheet("להחליף את הסידור?","השבוע כבר יש משמרות רשומות. ההעתקה תחליף אותן.","החלפה",go); else go();
};

function shareText(){
  const start=parse(week); let out=`סידור עבודה 993 רויאל גארדן אילת\n${weekLabel(week).range}\n`;
  for(let i=0;i<7;i++){
    const parts=S.types.map(t=>{ const c=cell(week,t.id,i); return c.length?`${t.name}: ${c.join(" + ")}`:""; }).filter(Boolean);
    out+=`\n${DAYS[i]} ${dm(addDays(start,i))} – ${parts.length?parts.join(" · "):"—"}`;
  }
  out+="\n\n"+shiftTypes().map(t=>`${t.name} ${t.from}–${t.to}`).join(" | ");
  share(out);
}
/* Draws the week as an image in the branch's familiar layout: days as columns, shifts as rows. */
function weekImage(){
  const start=parse(week), F="Heebo, Arial, sans-serif";
  const M=24, LABEL=200, COL=170, W=M*2+LABEL+COL*7;
  const TITLE=130, DAYH=62, DATEH=58, LH=54;
  const rows=S.types.map(t=>{
    const cells=[0,1,2,3,4,5,6].map(i=>cell(week,t.id,i));
    const maxN=Math.max(1,...cells.map(c=>c.length));
    const labelLines=[t.name+(t.id==="off"?"":""), ...(t.from?[`${t.from} -`,t.to]:[])];
    const h=Math.max(t.id==="off"?110:200, maxN*LH+60, labelLines.length*LH+30);
    return {t,cells,h,labelLines};
  });
  const H=M+TITLE+DAYH+DATEH+rows.reduce((a,r)=>a+r.h,0)+M+36;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d");
  g.fillStyle="#000"; g.fillRect(0,0,W,H);
  g.direction="rtl"; g.textAlign="center"; g.textBaseline="middle";
  const xR=W-M;                        // right edge of the table
  const colX=i=>xR-LABEL-COL*(i+1);    // left x of day column i (Sunday on the right)
  // title
  g.fillStyle="#fff"; g.font=`800 46px ${F}`;
  g.fillText("סידור עבודה 993 רויאל גארדן",W/2,M+42);
  g.font=`700 40px ${F}`; g.fillText(`אילת · ${weekLabel(week).range}`,W/2,M+96);
  let y=M+TITLE;
  // day names
  g.font=`500 38px ${F}`;
  for(let i=0;i<7;i++) g.fillText(DAYS[i],colX(i)+COL/2,y+DAYH/2+2);
  // green date row
  const yDate=y+DAYH;
  g.fillStyle="#1f4d33"; g.fillRect(xR-LABEL-COL*7,yDate,COL*7,DATEH);
  g.fillStyle="#fff"; g.font=`500 36px ${F}`; g.direction="ltr";
  for(let i=0;i<7;i++){ const d=addDays(start,i); g.fillText(dm(d),colX(i)+COL/2,yDate+DATEH/2+2); }
  g.direction="rtl";
  // shift rows
  y=yDate+DATEH;
  const today=todayIso();
  for(const r of rows){
    g.fillStyle="#fff"; g.font=`500 40px ${F}`;
    const lt=r.labelLines, ly=y+r.h/2-(lt.length-1)*LH/2;
    lt.forEach((s,k)=>{ g.direction=k?"ltr":"rtl"; g.fillText(s,xR-LABEL/2,ly+k*LH); });
    g.direction="rtl";
    g.font=`500 40px ${F}`;
    r.cells.forEach((names,i)=>{
      if(!names.length) return;
      const cy=y+r.h/2-(names.length-1)*LH/2;
      names.forEach((n,k)=>{
        const tw=Math.min(g.measureText(n).width+24,COL-16), cx=colX(i)+COL/2, yy=cy+k*LH;
        g.fillStyle=colorOf(n); g.beginPath(); if(g.roundRect) g.roundRect(cx-tw/2,yy-23,tw,46,9); else g.rect(cx-tw/2,yy-23,tw,46); g.fill();
        g.fillStyle=textOn(colorOf(n)); g.fillText(n,cx,yy+1,COL-28);
      });
      g.fillStyle="#fff";
    });
    y+=r.h;
  }
  // grid lines
  const top=yDate-DAYH, left=xR-LABEL-COL*7;
  g.strokeStyle="#fff"; g.lineWidth=3;
  const hs=[top+DAYH,yDate+DATEH]; let yy=yDate+DATEH; for(const r of rows){ yy+=r.h; hs.push(yy); }
  for(const h of hs){ g.beginPath(); g.moveTo(left,h); g.lineTo(xR,h); g.stroke(); }
  g.beginPath(); g.moveTo(left,top+DAYH); g.lineTo(left,yy); g.stroke();
  g.beginPath(); g.moveTo(xR,top+DAYH); g.lineTo(xR,yy); g.stroke();
  for(let i=0;i<7;i++){ const x=colX(i)+COL; g.beginPath(); g.moveTo(x,top+DAYH); g.lineTo(x,yy); g.stroke(); }
  // thin separators in the header area, like the original sheet
  g.strokeStyle="#555"; g.lineWidth=2;
  for(let i=0;i<=7;i++){ const x=i===7?left:colX(i)+COL; g.beginPath(); g.moveTo(x,top+6); g.lineTo(x,top+DAYH); g.stroke(); }
  g.fillStyle="#777"; g.font=`400 22px ${F}`; g.direction="rtl";
  g.fillText("צומת ספרים · סניף 993",W/2,H-M-6);
  return c.toDataURL("image/png");
}
$("btnShare").onclick=async()=>{
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const url=weekImage(), name=`shifts-993-${week}.png`;
    if(A&&A.shareImage){ A.shareImage(url.slice(url.indexOf(",")+1), name); return; }
    try{
      const blob=await (await fetch(url)).blob(), file=new File([blob],name,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"סידור עבודה 993"}); return; }
    }catch(e){ if(e&&e.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ shareText(); }
};

      s.querySelectorAll("#staffList button[data-sw]").forEach(b=>b.onclick=()=>{ const n=S.staff[+b.dataset.sw]; palFor = palFor===n ? "" : n; openSettings(); });
      s.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{ S.colors[b.dataset.who]=b.dataset.c; palFor=""; saveS(); renderShifts(); openSettings(); });
      s.querySelector("#setAdd").onclick=()=>{ const n=s.querySelector("#setNew").value.trim(); if(n&&!S.staff.includes(n)){ S.staff.push(n); ensureColors(); } openSettings(); };
      s.querySelectorAll(".typerow input").forEach(inp=>inp.onchange=()=>{
        const t=S.types.find(x=>x.id===inp.closest(".typerow").dataset.id); const v=inp.value.trim(); if(v){ t[inp.dataset.k]=v; saveS(); }
      });
      s.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ setTheme(b.dataset.theme); openSettings(); });
      s.querySelector("#pubCopy").onclick=()=>{ if(A&&A.copy) A.copy(SYNC.site); else try{ navigator.clipboard.writeText(SYNC.site); }catch(e){} toast("הקישור הועתק"); };
      s.querySelector("#sitePwSave").onclick=()=>{
        const pw=s.querySelector("#sitePw").value.trim();
        if(pw && pw.length<4){ toast("סיסמה קצרה מדי (לפחות 4 תווים)"); return; }
        A.setSitePassword(pw); toast(pw?"הסיסמה נשמרה – מפרסם מחדש":"הסיסמה הוסרה – האתר פתוח"); publishNow(); openSettings(); };
      s.querySelector("#pubShare").onclick=()=>{
        const pw=A&&A.getSitePassword?A.getSitePassword():"";
        share(`סידור העבודה של סניף 993 (צומת ספרים רויאל גארדן):\n${SYNC.site}${pw?`\nסיסמה: ${pw}`:""}\n\nאחרי הכניסה: "מי אני?" ובוחרים את השם. אפשר להוסיף למסך הבית מתפריט הדפדפן.`); };
      s.querySelector("#pubNow").onclick=()=>{ publishNow(); toast("מפרסם…"); };
      s.querySelector("#pubTokSave").onclick=()=>{ const t=s.querySelector("#pubTok").value.trim(); if(!t||!A) return;
        A.setToken(t); toast("הטוקן נשמר"); publishNow(); openSettings(); };
      s.querySelector("[data-a=done]").onclick=()=>{ closeSheet(); renderShifts(); };
      s.scrollTop=keepScroll;
    });
}

/* ================= CLOCK ================= */
const sortC = () => C.sort((a,b)=>b.date.localeCompare(a.date)||(b.id-a.id));
const nextId = () => C.reduce((m,x)=>Math.max(m,x.id||0),0)+1;
function renderClock(){
  const t=todayIso(), d=new Date();
  $("clockSub").textContent = `${DAYS[d.getDay()]} ${dm(d)}${S.me?" · "+S.me:""}`;
  const mine=myShiftsOn(t).filter(x=>x.from);
  $("nowIn").textContent = nowHM() + (mine.length?` · משמרת מ-${mine[0].from}`:"");
  $("nowOut").textContent = nowHM() + (mine.length?` · עד ${mine[mine.length-1].to}`:"");
  sortC();
  if(!C.length){ $("log").innerHTML=`<div class="emptybox">עוד לא נרשמו עדכונים.<br>"כניסה עכשיו" רושם את השעה הנוכחית, ו-＋ מוסיף עדכון ידני לכל תאריך.</div>`; return; }
  const groups={}; for(const e of C){ const k=e.date.slice(0,7); (groups[k]=groups[k]||[]).push(e); }
  let h="";
  for(const k of Object.keys(groups).sort().reverse()){
    const [y,m]=k.split("-").map(Number);
    h+=`<div class="month"><b>${MONTHS[m-1]} ${y}</b><button class="pill" data-share="${k}">שליחה ⤴</button></div>
      <table class="log"><colgroup><col style="width:22%"><col style="width:22%"><col style="width:22%"><col></colgroup>
      <thead><tr><th>תאריך</th><th>כניסה</th><th>יציאה</th><th>הערה</th></tr></thead><tbody>`;
    for(const e of groups[k]){ const dd=parse(e.date);
      h+=`<tr data-id="${e.id}"><td>${dm(dd)}</td><td class="t">${esc(e.in)}</td><td class="t">${esc(e.out)}</td><td class="note">${esc(e.note)}</td></tr>`; }
    h+="</tbody></table>";
  }
  $("log").innerHTML=h;
}
$("log").onclick=e=>{
  const sh=e.target.closest("[data-share]"); if(sh){ shareMonth(sh.dataset.share); return; }
  const tr=e.target.closest("tr[data-id]"); if(tr) editEntry(C.find(x=>x.id==tr.dataset.id));
};
function shareMonth(k){
  const [y,m]=k.split("-").map(Number);
  const rows=C.filter(e=>e.date.startsWith(k)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let out=`עדכון שעת כניסה/יציאה${S.me?" – "+S.me:""}\n${MONTHS[m-1]} ${y}\n`;
  for(const e of rows){ const p=[]; if(e.in)p.push("כניסה "+e.in); if(e.out)p.push("יציאה "+e.out);
    out+=`\n${dm(parse(e.date))} – ${p.join(", ")}${e.note?" ("+e.note+")":""}`; }
  share(out);
}
function punch(kind){
  const t=todayIso(), now=nowHM();
  let e=C.find(x=>x.date===t && !x[kind]);
  if(kind==="out" && !e) e=null;
  if(e) e[kind]=now; else { e={id:nextId(),date:t,in:"",out:"",note:""}; e[kind]=now; C.push(e); }
  saveC(); renderClock();
  toast((kind==="in"?"נרשמה כניסה ":"נרשמה יציאה ")+now);
}
$("btnIn").onclick=()=>punch("in");
$("btnOut").onclick=()=>punch("out");
$("btnAdd").onclick=()=>editEntry(null);
function frequentNotes(){
  const cnt={"בנק":1}; for(const e of C) if(e.note) cnt[e.note]=(cnt[e.note]||0)+1;
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
}
function editEntry(e){
  const isNew=!e; e=e||{date:todayIso(),in:"",out:"",note:""};
  openSheet(`<h2>${isNew?"עדכון ידני":"עריכת עדכון"}</h2>
    <label>תאריך</label><input type="date" id="fDate" value="${e.date}">
    <div class="hint" id="fHint" style="display:none"></div>
    <div class="two"><div><label>כניסה</label><input type="time" id="fIn" value="${esc(e.in)}"></div>
      <div><label>יציאה</label><input type="time" id="fOut" value="${esc(e.out)}"></div></div>
    <div class="row" style="margin-top:6px"><button class="pill" data-now="fIn">כניסה = עכשיו</button><button class="pill" data-now="fOut">יציאה = עכשיו</button></div>
    <label>הערה</label><input id="fNote" value="${esc(e.note)}" placeholder="למשל: בנק">
    <div class="row" style="margin-top:6px">${frequentNotes().map(n=>`<button class="pill" data-note="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div class="acts">${isNew?"":`<button class="del" data-a="del">מחיקה</button>`}<button data-a="no">ביטול</button><button class="pri" data-a="ok">שמירה</button></div>`, s=>{
      const hint=()=>{ const v=s.querySelector("#fDate").value; const h=s.querySelector("#fHint");
        const t=v?myShiftsOn(v):[]; if(t.length){ h.style.display=""; h.textContent="לפי הסידור: "+t.map(x=>x.name+(x.from?" "+typeHours(x):"")).join(", "); } else h.style.display="none"; };
      s.querySelector("#fDate").onchange=hint; hint();
      s.querySelectorAll("[data-now]").forEach(b=>b.onclick=()=>{ s.querySelector("#"+b.dataset.now).value=nowHM(); });
      s.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{ s.querySelector("#fNote").value=b.dataset.note; });
      s.querySelector("[data-a=no]").onclick=closeSheet;
      const del=s.querySelector("[data-a=del]");
      if(del) del.onclick=()=>{ C=C.filter(x=>x!==e); saveC(); closeSheet(); renderClock(); toast("נמחק"); };
      s.querySelector("[data-a=ok]").onclick=()=>{
        const date=s.querySelector("#fDate").value, i=s.querySelector("#fIn").value, o=s.querySelector("#fOut").value;
        if(!date){ toast("חסר תאריך"); return; }
        if(!i&&!o){ toast("צריך שעת כניסה או יציאה"); return; }
        Object.assign(e,{date,in:i,out:o,note:s.querySelector("#fNote").value.trim()});
        if(isNew){ e.id=nextId(); C.push(e); }
        saveC(); closeSheet(); renderClock(); toast("נשמר");
      };
    });
}

  fitPubs();
  if(pubsLoaded) return; pubsLoaded=true;
  $("pubsFrame").src="pubs.html";
}
function fitPubs(){ $("tab-pubs").style.bottom=$("nav").offsetHeight+"px"; }
window.addEventListener("resize",()=>{ if(tab==="pubs") fitPubs(); });
const pubsWin=()=>{ try{ return $("pubsFrame").contentWindow; }catch(e){ return null; } };
// theme changes from either page apply to both
window.syncFrameTheme=function(){ const w=pubsWin(); try{ w&&w.applyTheme&&w.applyTheme(); }catch(e){} };
window.onPubsBackupSaved=function(ok){ const w=pubsWin(); try{ w&&w.onBackupSaved&&w.onBackupSaved(ok); }catch(e){} };
// Back inside the publishers page: close an open dialog, then clear the search.
function pubsBack(){
  const w=pubsWin(); if(!w) return false;
  try{
    const d=w.document;
    const open=[...d.querySelectorAll('dialog[open], .modal.on, .sheet.on, .ov.on, [aria-modal="true"]')].filter(x=>x.offsetParent!==null||x.open);

  }catch(e){}
  return false;
}

/* ================= sync: manager publishes, employees read ================= */
const hm = d => pad(d.getHours())+":"+pad(d.getMinutes());
function ago(iso){
  if(!iso) return ""; const d=new Date(iso), m=Math.round((Date.now()-d)/6e4);
  const day = iso.slice(0,10)===todayIso() ? "" : ` ${dm(d)}`;
  return m<1 ? "הרגע" : m<60 ? `לפני ${m} דק׳` : `${day} ${hm(d)}`.trim();
}
function setSync(html, err){ const el=$("sync"); el.innerHTML=html; el.classList.toggle("err",!!err); }
// What employees get: the schedule without the manager's personal settings, recent and future weeks only.
function publicPayload(){
  const from=iso(addDays(sundayOf(new Date()),-7*8)), weeks={};
  for(const k of Object.keys(S.weeks)) if(k>=from) weeks[k]=S.weeks[k];
  return {updated:new Date().toISOString(), staff:S.staff, colors:S.colors, types:S.types, weeks};
}
var pubTimer=null; // var: saveS may run before this line
function schedulePublish(){ if(VIEWER||!A||!A.publish) return; clearTimeout(pubTimer); pubTimer=setTimeout(publishNow,1500); setSync("ממתין לפרסום…"); }
function publishNow(){
  if(VIEWER||!A||!A.publish) return;
  if(!A.hasToken()){ setSync(`לא מפורסם לעובדים – חסר טוקן <button onclick="openSettings()">הגדרה</button>`, true); return; }
  setSync("מפרסם לעובדים…");
  A.publish(SYNC.repo, SYNC.branch, SYNC.path, JSON.stringify(publicPayload()));
}
// Called by the app when a publish finishes.
window.onPublished=function(ok,msg){
  const st={ok, msg, at:new Date().toISOString()}; store.set("pub_status",st); showPubStatus();
};
function showPubStatus(){
  if(VIEWER) return;
  if(!A||!A.publish){ setSync(""); return; }
  const st=store.get("pub_status");
  if(!A.hasToken()) return setSync(`לא מפורסם לעובדים – חסר טוקן <button onclick="openSettings()">הגדרה</button>`, true);
  if(!st) return setSync("עוד לא פורסם לעובדים");
  if(st.ok) setSync(`פורסם לעובדים · ${ago(st.at)}`);
  else setSync(`הפרסום נכשל: ${esc(st.msg)} <button onclick="publishNow()">שוב</button>`, true);
}
// Employees: read the published schedule.
// The API is always fresh but allows ~60 anonymous calls an hour per network, so it is used when the page
// opens or comes back, on "רענון", and every 10 minutes; in between, raw.githubusercontent (cached ≤5 min).
let lastRemote="", fetching=false, lastApi=0;
async function fetchRemote(manual){
  if(fetching) return; fetching=true;
  const useApi = manual || Date.now()-lastApi > 10*60e3;
  const raw=`https://raw.githubusercontent.com/${SYNC.repo}/${SYNC.branch}/${SYNC.path}?t=${Date.now()}`;
  const api=`https://api.github.com/repos/${SYNC.repo}/contents/${SYNC.path}?ref=${SYNC.branch}`;
  let text=null;
  if(useApi){ try{ const r=await fetch(api,{cache:"no-store",headers:{Accept:"application/vnd.github.raw+json"}}); if(r.ok){ text=await r.text(); lastApi=Date.now(); } }catch(e){} }
  if(text===null){ try{ const r=await fetch(raw,{cache:"no-store"}); if(r.ok) text=await r.text(); }catch(e){} }
  fetching=false;
  if(text===null){
    const c=store.get("remote");
    setSync(c?`אין חיבור – מוצג הסידור מ-${ago(c.updated)} <button onclick="fetchRemote(true)">רענון</button>`:"לא ניתן לטעון את הסידור כרגע", true); return;
  }
  try{
    let d=JSON.parse(text);
    if(d.pending){ store.set("remote",null); S=Object.assign(normalizeS(null),{me:S.me}); renderShifts(); setSync("הסידור עוד לא פורסם על ידי המנהל"); return; }
    if(d.enc){
      const pw=store.get("pw");
      const plain = pw ? await decryptSchedule(d,pw) : null;
      if(plain===null){ store.set("pw",""); store.set("remote",null); showLock(d, !!pw); setSync("נדרשת סיסמה"); return; }
      text=plain; d=JSON.parse(plain);
    }
    // keep the newest copy: raw can lag behind the API for a minute
    const cur=store.get("remote");
    if(!(cur&&cur.updated&&d.updated&&cur.updated>d.updated)){ // never go back to an older (cached) copy
      if(text!==lastRemote){ lastRemote=text; const me=S.me; S=normalizeS(d); S.me=me; store.set("remote",d); if(!sheetOpen) renderShifts(); }
    }
    setSync(`עודכן ע״י המנהל ${ago(S.updated)} · מתרענן אוטומטית <button onclick="fetchRemote(true)">רענון</button>`);
  }catch(e){ setSync("שגיאה בקריאת הסידור", true); }
}
/* ---- password-protected schedule (encrypted by the manager app) ---- */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let keyCache={};
async function decryptSchedule(d, pw){
  try{
    const ck=d.salt+"|"+pw;
    if(!keyCache[ck]){
      const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      keyCache={[ck]: await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(d.salt),iterations:d.iter||150000,hash:"SHA-256"},
        base, {name:"AES-GCM",length:256}, false, ["decrypt"])};
    }
    const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(d.iv)}, keyCache[ck], b64(d.data));
    return new TextDecoder().decode(out);
  }catch(e){ return null; }
}
let lockData=null;
function showLock(d, changed){
  lockData=d; $("lock").classList.add("on");
  $("lockErr").textContent = changed ? "הסיסמה הוחלפה – הזינו את הסיסמה החדשה" : "";
  setTimeout(()=>$("lockPw").focus(),50);
}
$("lockForm").onsubmit=async e=>{
  e.preventDefault();
  const pw=$("lockPw").value.trim(); if(!pw||!lockData) return;
  $("lockErr").textContent="בודק…";
  const plain=await decryptSchedule(lockData,pw);
  if(plain===null){ $("lockErr").textContent="סיסמה שגויה"; $("lockPw").select(); return; }
  store.set("pw",pw); $("lockPw").value=""; $("lock").classList.remove("on"); lockData=null;
  lastRemote=""; fetchRemote(true);
};

if(VIEWER){
  fetchRemote(true);
  setInterval(()=>{ if(!document.hidden) fetchRemote(false); }, 60000);
  let hiddenAt=0;
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) hiddenAt=Date.now(); else fetchRemote(Date.now()-hiddenAt>60e3); });
}

/* ================= native hooks ================= */
// Called by the app: open a tab (and for shifts, a given week) – e.g. from the widget.
window.openFrom=function(t,wk){ if(sheetOpen) closeSheet(); if(wk&&/^\d{4}-\d\d-\d\d$/.test(wk)) week=wk; openTab(t||"shifts"); };
// Back button: close a sheet, clear the search, go back to shifts; "" lets the app exit.
window.onBack=function(){
  if(sheetOpen){ closeSheet(); return "handled"; }
  if(tab==="pubs" && pubsBack()) return "handled";
  if(tab!=="shifts"){ openTab("shifts"); return "handled"; }
  return "";
};
// Re-render when the app returns to the foreground (date may have changed, data edited from elsewhere).
window.onResumeApp=function(){ applyTheme(); if(window.syncFrameTheme) syncFrameTheme(); const s=store.get("shifts"); if(s&&s.weeks) S=s; if(tab==="shifts") renderShifts(); if(tab==="clock") renderClock(); showPubStatus(); };
openTab("shifts");
showPubStatus();
// Make sure the employees' copy matches this phone (the app skips the upload when nothing changed).
if(!VIEWER&&A&&A.publish&&A.hasToken()) publishNow();
</script>
